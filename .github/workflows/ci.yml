name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tenant-guard:
    name: API (garde isolement tenant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Garde statique : rejette tout accès à une table tenant sans radioId dans
      # le même bloc (api/src/routes + api/src/services). Voir scripts/check-tenant-queries.mjs.
      # RLS_STRICT=1 + ALS_HTTP (défaut) : accepte wrappers OU radioId (middleware
      # bindRequestDb pose la GUC). Activer DATABASE_URL=enondes_app seulement après
      # npm run test:rls vert sur une base jetable — pas encore en CI.
      - run: RLS_STRICT=1 npm run tenant:guard

  frontend-unit:
    name: Site (tests unitaires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  smoke:
    name: Smoke Playwright (pas de snapshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke accueil + schedule API
        run: npx playwright test --config=tests/smoke/playwright.config.mjs
        env:
          SMOKE_API_URL: https://patient-endurance-production-21c8.up.railway.app

  admin:
    name: Admin (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://patient-endurance-production-21c8.up.railway.app

  frontend:
    name: Site statique (hash SW · syntaxe JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Échoue si la marque, le bundle CSS, les partials ou le hash SW ne sont
      # pas à jour (build-brand → build-css → build-html → build-sw doivent
      # avoir tourné après une modif). build-css requiert lightningcss (npm ci).
      - name: Vérifier le pipeline de build (marque · partials · hash SW)
        run: node scripts/build-all.mjs --check
      # Vérifie que chaque module ES parse (attrape les erreurs de syntaxe).
      - name: Vérifier la syntaxe des modules JS
        run: |
          set -e
          for f in js/*.js; do node --check "$f"; done

  stations:
    name: "Hub stations (intégrité manifeste)"
    runs-on: ubuntu-latest
    # Pas de defaults.working-directory → repo root. Le script est pur Node, zéro
    # dépendance → pas de `npm ci` (plus rapide). brand/clients.json est gitignored
    # (privé) → absent du checkout CI : le script bascule en vérification d'intégrité
    # des artefacts commités (enondes-site/stations.json + nginx.conf).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-stations.mjs --check
