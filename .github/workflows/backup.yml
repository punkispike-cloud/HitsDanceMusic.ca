name: Backup Postgres

# Backup quotidien de la base prod vers S3/R2 (audit 2026-08-16, G1).
# Le job rouge = signal d'alerte (GitHub envoie un courriel sur échec de
# workflow planifié). Vérifiable à la main : Actions → Backup Postgres →
# Run workflow. Restauration : scripts/restore-drill.mjs (drill testé,
# RTO ~4 s) ou pg_restore manuel depuis un .dump du bucket.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   BACKUP_DATABASE_URL     URL publique de la base prod (DATABASE_PUBLIC_URL)
#   S3_ENDPOINT             ex. https://<accountid>.r2.cloudflarestorage.com
#   S3_BUCKET               bucket dédié aux backups
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
#   S3_REGION               (optionnel, défaut "auto" pour R2)
#   S3_FORCE_PATH_STYLE     (optionnel, défaut "true")
#   BACKUP_RETENTION_DAYS   (optionnel, défaut 30)
#   DATABASE_CA_CERT        (optionnel — pinning CA ; sinon vérification stricte)

on:
  schedule:
    # Quotidien 07:17 UTC = 03:17 (heure de l'Est) — heure creuse.
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Dump → S3/R2 (rétention 30 j)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      # pg_dump/pg_restore (le script valide l'archive avec pg_restore --list).
      # Le paquet `postgresql-client` d'Ubuntu est resté en 16 alors que la base
      # Railway tourne en 18 ; pg_dump refuse de sauvegarder un serveur plus
      # récent que lui (« aborting because of server version mismatch »). On
      # installe donc explicitement le client 18 depuis le dépôt PGDG.
      - name: Installer postgresql-client-18 (dépôt PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # /usr/bin/pg_dump est le wrapper postgresql-common : il choisit la
          # version par défaut du système (16 sur le runner), pas la plus
          # récente installée. On met donc les vrais binaires 18 devant.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Vérifier la version du client
        run: |
          pg_dump --version
          # Échoue tout de suite si le PATH ne pointe pas sur le client 18 :
          # sans ça, l'erreur n'apparaît qu'au dump, noyée dans la sortie.
          pg_dump --version | grep -qE '\(PostgreSQL\) 18\.' || {
            echo "::error::pg_dump n'est pas en 18 — le backup echouera sur un mismatch de version"
            exit 1
          }

      - name: Installer les dépendances API (SDK S3)
        working-directory: api
        run: npm ci

      - name: Backup Postgres → S3/R2
        run: node api/scripts/backup-db.mjs
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
