<!-- presence-badge : compteur anonymisé (visiteurs/auditeurs, sans IP) -->
<div id="presenceBadge" class="presence-badge" hidden role="status" aria-live="polite" aria-label="Audience en direct">
  <span class="presence-pill presence-listeners"><span class="presence-live-dot" aria-hidden="true"></span><strong class="presence-count" data-presence="listeners">0</strong>&nbsp;à l’écoute</span>
  <span class="presence-pill presence-visitors"><strong class="presence-count" data-presence="visitors">0</strong>&nbsp;en ligne</span>
</div>
