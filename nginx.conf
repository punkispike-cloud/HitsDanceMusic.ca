server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----- Compression -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
    gzip_vary on;

    # =========================================================
    #  En-têtes de sécurité — appliqués à toutes les réponses.
    #  CSP whiteliste uniquement les hôtes réellement utilisés.
    # =========================================================
    set $csp "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https://cast5.asurahosting.com; connect-src 'self' https://cast5.asurahosting.com https://itunes.apple.com https://*.mzstatic.com https://lrclib.net https://api.open-meteo.com https://geocoding-api.open-meteo.com https://corsproxy.io https://api.allorigins.win wss: ws:; manifest-src 'self'; worker-src 'self';";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # HSTS effectif quand servi via HTTPS (TLS terminé en amont).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Pages : fallback 404 -----
    error_page 404 /404.html;

    # ----- Assets immuables -----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # ----- CSS / JS racine : cache court avec revalidation -----
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- Service worker : jamais cacher (sinon nouvelle version jamais récupérée) -----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ----- Manifest PWA : MIME type + cache court -----
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
