# Zone de cache pour le proxy /np (contexte http, hors server). 1 Mo de clés
# suffit largement (une seule URL), 10 Mo de contenu, purge après 60 s d'inactivité.
proxy_cache_path /var/cache/nginx/np levels=1:2 keys_zone=np_cache:1m max_size=10m inactive=60s use_temp_path=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----- Compression -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;
    gzip_vary on;
    gzip_disable "msie6";

    # Brotli si module dispo (sinon ignoré silencieusement par nginx au load).
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;

    # =========================================================
    #  En-têtes de sécurité — appliqués à toutes les réponses.
    #  CSP whiteliste uniquement les hôtes réellement utilisés.
    #  - script-src : 'unsafe-inline' retiré (bootstrap thème externalisé,
    #    aucun handler onclick inline).
    #  - connect-src : proxies CORS publics (corsproxy.io, allorigins.win)
    #    retirés — remplacés par /np/ (cf. location /np/ ci-dessous).
    #  - img-src : restreint aux hôtes réels (mzstatic pour iTunes,
    #    asurahosting au cas où, plus self/data/blob).
    #  - style-src : 'unsafe-inline' conservé (styles inline utilisés
    #    par le JS pour --card-accent, positions drag, etc.). À durcir
    #    via nonce ou hash dans un sprint ultérieur.
    # =========================================================
    set $csp "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.mzstatic.com https://cast5.asurahosting.com https://*.amazonaws.com; media-src 'self' blob: https://cast5.asurahosting.com https://*.amazonaws.com; connect-src 'self' https://cast5.asurahosting.com https://itunes.apple.com https://*.mzstatic.com https://lrclib.net https://api.open-meteo.com https://geocoding-api.open-meteo.com https://patient-endurance-production-21c8.up.railway.app wss: ws:; manifest-src 'self'; worker-src 'self';";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # HSTS effectif quand servi via HTTPS (TLS terminé en amont).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Pages : fallback 404 -----
    error_page 404 /404.html;

    # ----- Sécurité : interdire l'accès aux dossiers internes du repo -----
    location ~ ^/(_partials|scripts|presence)/ { deny all; return 404; }
    location ~ /\.(git|gitignore|env) { deny all; return 404; }

    # ----- Assets immuables -----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
    }

    # ----- CSS / JS (modules ES dans /js/, theme-init.js dans /assets/) -----
    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        # Garantit le bon type MIME pour les imports ES (sinon le navigateur refuse)
        types { application/javascript js mjs; text/css css; }
    }

    # ----- Service worker : jamais cacher (sinon nouvelle version jamais récupérée) -----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ----- Manifest PWA : MIME type + cache court -----
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- Proxy now-playing : élimine la dépendance aux proxies CORS publics -----
    # Le flux SHOUTcast /7.html ne renvoie pas d'en-tête CORS, donc on le
    # proxifie depuis notre domaine pour pouvoir le lire en fetch() sans
    # passer par corsproxy.io ou allorigins.win.
    location = /np {
        proxy_pass https://cast5.asurahosting.com/proxy/hitsdanc/7.html;
        proxy_set_header Host cast5.asurahosting.com;
        proxy_set_header User-Agent "HitsDanceMusic-Proxy/1.0";
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 3s;
        # Cache court : le titre courant change toutes les ~3 min. La zone
        # np_cache (définie en contexte http ci-dessus) absorbe la charge :
        # un seul appel upstream toutes les 5 s, quel que soit le nb de visiteurs.
        proxy_cache np_cache;
        # Clé fixe : /np ne proxifie qu'UNE seule URL upstream → tous les visiteurs
        # partagent la même entrée de cache (indépendant du Host envoyé par le client).
        proxy_cache_key "np_7html";
        # AsuraHosting peut renvoyer des en-têtes anti-cache / Set-Cookie : on les
        # ignore pour que proxy_cache_valid s'applique réellement.
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 5s;
        proxy_cache_bypass $http_pragma;
        # Résilience : sert la dernière version connue si l'upstream tombe.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # CORS : autorise uniquement notre origine
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
