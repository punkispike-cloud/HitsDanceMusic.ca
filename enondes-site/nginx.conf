# En Ondes — Hub d'écoute (déploiement statique nginx, même patron que la racine).
# Le bloc « location = /np/<slug> » est GÉNÉRÉ par scripts/build-stations.mjs
# entre les marqueurs NP-PROXY (ne pas éditer ce bloc à la main).

# Zone de cache pour les proxies /np (contexte http, hors server) : un seul appel
# upstream toutes les 5 s par station, quel que soit le nombre d'auditeurs.
proxy_cache_path /var/cache/nginx/np levels=1:2 keys_zone=np_cache:1m max_size=10m inactive=60s use_temp_path=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ----- Compression -----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
        application/json application/manifest+json image/svg+xml font/ttf font/otf;
    gzip_vary on;

    # ----- En-têtes de sécurité (CSP adaptée au hub multi-stations) -----
    #  - media-src https: : les flux audio sont des hôtes tiers variés (agrégateur).
    #  - connect-src : itunes/mzstatic (pochettes) ; /np/<slug> et stations.json = self.
    #  - img-src : mzstatic (pochettes iTunes) + self/data.
    set $csp "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.mzstatic.com; media-src 'self' blob: https:; connect-src 'self' https://itunes.apple.com https://*.mzstatic.com; manifest-src 'self'; worker-src 'self';";

    add_header Content-Security-Policy $csp always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Sécurité : pas d'accès aux fichiers cachés ni aux fichiers de déploiement -----
    location ~ /\.(git|gitignore|env) { deny all; return 404; }
    location ~* ^/(nginx\.conf|Dockerfile|\.dockerignore)$ { deny all; return 404; }

    # ----- Assets immuables -----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- CSS / JS (modules ES) : bon MIME + cache court -----
    location ~* \.(css|js|mjs)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        types { application/javascript js mjs; text/css css; }
    }

    # ----- Service worker : jamais cacher -----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # ----- Manifest PWA : MIME + cache court -----
    location = /manifest.webmanifest {
        types { } default_type "application/manifest+json";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- Manifeste des stations : pas de cache long (change quand on ajoute une radio) -----
    location = /stations.json {
        add_header Cache-Control "public, max-age=30, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ----- SEO : robots + sitemap (servis tels quels, court-circuitent try_files) -----
    location = /robots.txt { add_header X-Content-Type-Options "nosniff" always; }
    location = /sitemap.xml { default_type application/xml; add_header X-Content-Type-Options "nosniff" always; }

    # ===================================================================
    #  Proxy now-playing par station (same-origin → lisible par le hub).
    # === NP-PROXY:BEGIN (généré par scripts/build-stations.mjs — ne pas éditer) ===
    location = /np/hitsdance {
        proxy_pass https://cast5.asurahosting.com/proxy/hitsdanc/7.html;
        proxy_set_header Host cast5.asurahosting.com;
        proxy_set_header User-Agent "EnOndes-Hub-Proxy/1.0";
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s; proxy_read_timeout 5s; proxy_send_timeout 3s;
        proxy_cache np_cache;
        proxy_cache_key "np_hitsdance";
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        proxy_cache_valid 200 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    # === NP-PROXY:END ===
    # ===================================================================

    # Garde-fou : tout /np/<slug> non généré → 404 (et non l'accueil HTML, qui
    # ferait échouer le parsing now-playing). Les blocs exacts ci-dessus priment.
    location /np/ { return 404; }

    # ----- Pages : le hub est mono-page ; route inconnue → accueil -----
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
